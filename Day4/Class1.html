<body>
    <h1>Registration Form</h1>
    <div>
        <form action="">
             <label for="fname">First Name: </label>
            <input type="text" "id="fname"  placeholder="Enter Your First Name">
            <br><br
             <label for="lname">Last Name: </label> 
            <input type="text" id="lname" placeholder="Enter Your Last Name">
            <br><br>
            
  </div>
    
        <label for="Email">Email:</label>
        <input type="email" id="Email" placeholder="Enter Your Email" disabled="" >
        <br><br>
        <label for="password">Password:</label>
        <input type="password" maxlength="6" minlength="4" id="password" placeholder="Enter Your Password" required>
        <br><br>
        <label for="phone">Phone:</label>
        
        <input type="tel" id="phone" placeholder="Enter Your Phone Number" ><br>
        <br><br>
        <label for="message">Message:</label>
        <textarea name="message" id="message" cols="20" rows="1" placeholder="Enter Your Message"></textarea>
        <br><br>
        <label for="dob">Date Of B:</label>
        <input type="date" id="dob">
        <br><br>
        <label for="age">Age:</label>
        <input type="number" id="age" value="10" placeholder="Enter Your Age">
        <br><br>
            <label for="image">Choose Image:</label>
            <input type="file" id="image">
            <br><br>
            <div>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>
