<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"> -->
      <script src="https://cdn.tailwindcss.com"></script>
    <title>EVENT HANDLER</title>

</head>
<body>

     <header
       class="flex backdrop-blur z-50 justify-between fixed w-full h-16  shadow-lg  items-center px-5 bg-white"
       >
       <a href="#hero">
        <img
         src="../Day15/images/homepage.webp" 
         width="40" 
         height="40" 
         alt=""
         />
       </a>
      
        <nav  
        id="nav" 
        class="max-md:hidden max-md:absolute max-md:left-0 max-md:top-16 max-md:bg-white max-md:w-full">
        <ul 
        class="flex gap-[20px] max-md:flex-col max-md:p-5">
        <li>
                    <a href="#about" class="max-md:text-[20px]">About</a>
                </li>
                <li>
                    <a href="#services" class="max-md:text-[20px]">services </a>
                </li>
                <li>
                    <a href="#portfolio" class="max-md:text-[20px]">portfolio </a>
                </li>
                <li>
                    <a href="#contact" class="max-md:text-[20px]">contact </a>
                </li>
             </ul>
        </nav>
    <img 
    src="../Day15/images/hambergan.jpg" 
    id="hamburger"
     class="hidden max-md:block w-[30px] h-[30px] cursor-pointer "
      alt=""
      />

      <img src="../Day15/images/homepage.webp"
      id="close"
        class="hidden z-[999]"
        alt=""
        />
       </header>
       <main class="pt-16">
        <section id="hero" class="h-screen flex items-center justify-center bg-gray-200">
            <h1 class="text-4xl font-bold">Welcome to My Website</h1>
        </section>
        <section id="about" class="h-screen flex items-center justify-center bg-gray-300">
            <h2 class="text-3xl font-semibold">About Us</h2>
        </section>
        <section id="services" class="h-screen flex items-center justify-center bg-gray-400">
            <h2 class="text-3xl font-semibold">Our Services</h2>
        </section>
        <section id="portfolio" class="h-screen flex items-center justify-center bg-gray-500">
            <h2 class="text-3xl font-semibold">Our Portfolio</h2>
        </section>
        <section id="contact" class="h-screen flex items-center justify-center bg-gray-600">
            <h2 class="text-3xl font-semibold">Contact Us</h2>
        </section>


   <script >
    let hamburger = document.getElementById("hamburger");
    let nav = document.getElementById("nav");

    hamburger.addEventListener("click", () => {

      nav.classList.toggle("max-md:hidden");

    });
   </script>
</body>
</html>
